name: mail-collector-local

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-demo-root-only
      MYSQL_DATABASE: mail_collector_demo
      MYSQL_USER: local_demo
      MYSQL_PASSWORD: local-demo-password
    ports:
      - "127.0.0.1:3368:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=local-demo-password mysql -h127.0.0.1 -ulocal_demo mail_collector_demo -e 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 15s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "local-demo-redis"]
    ports:
      - "127.0.0.1:6398:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "local-demo-redis", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  receiver:
    build:
      context: ./php
    environment:
      MAIL_COLLECTOR_LOCAL_DEMO: "1"
      PHP_CLI_SERVER_WORKERS: "4"
    ports:
      - "127.0.0.1:5562:8080"
    volumes:
      - ../.local-demo/php-logs:/srv/public/api
      - ../steam_inbound.php:/srv/public/api/steam_inbound.php:ro
      - ./php/functions.php:/srv/public/includes/functions.php:ro
      - ./php/steam_secret.php:/srv/secrets/steam_secret.php:ro
      - ./php/router.php:/srv/router.php:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/__demo/health') === false ? 1 : 0);"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redis-data:

